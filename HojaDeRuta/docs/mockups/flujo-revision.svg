<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f4f7fb"/>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="30" fill="#23395d">Flujo de revision y aprobacion</text>

  <rect x="70" y="150" width="200" height="90" rx="12" fill="#dbeafe" stroke="#7aa2d6"/>
  <text x="128" y="188" font-family="Arial, sans-serif" font-size="24" fill="#23395d">Preparo</text>
  <text x="102" y="218" font-family="Arial, sans-serif" font-size="16" fill="#44546a">Usuario creador de la hoja</text>

  <rect x="330" y="150" width="200" height="90" rx="12" fill="#fff3bf" stroke="#e0b400"/>
  <text x="405" y="188" font-family="Arial, sans-serif" font-size="24" fill="#23395d">Reviso</text>
  <text x="362" y="218" font-family="Arial, sans-serif" font-size="16" fill="#44546a">Primera revision habilitada</text>

  <rect x="590" y="150" width="200" height="90" rx="12" fill="#e7f5ff" stroke="#74c0fc"/>
  <text x="635" y="188" font-family="Arial, sans-serif" font-size="24" fill="#23395d">Gerente / Dir.</text>
  <text x="635" y="218" font-family="Arial, sans-serif" font-size="16" fill="#44546a">Segunda revision</text>

  <rect x="850" y="150" width="220" height="90" rx="12" fill="#e7f5ff" stroke="#74c0fc"/>
  <text x="875" y="188" font-family="Arial, sans-serif" font-size="24" fill="#23395d">Engagement Partner</text>
  <text x="905" y="218" font-family="Arial, sans-serif" font-size="16" fill="#44546a">Revision superior</text>

  <rect x="460" y="340" width="260" height="100" rx="14" fill="#d3f9d8" stroke="#51cf66"/>
  <text x="502" y="382" font-family="Arial, sans-serif" font-size="28" fill="#1f5130">Socio firmante</text>
  <text x="500" y="414" font-family="Arial, sans-serif" font-size="16" fill="#2b3645">Etapa final con firma del documento</text>

  <line x1="270" y1="195" x2="330" y2="195" stroke="#44546a" stroke-width="4"/>
  <polygon points="330,195 316,188 316,202" fill="#44546a"/>
  <line x1="530" y1="195" x2="590" y2="195" stroke="#44546a" stroke-width="4"/>
  <polygon points="590,195 576,188 576,202" fill="#44546a"/>
  <line x1="790" y1="195" x2="850" y2="195" stroke="#44546a" stroke-width="4"/>
  <polygon points="850,195 836,188 836,202" fill="#44546a"/>
  <line x1="960" y1="240" x2="960" y2="305" stroke="#44546a" stroke-width="4"/>
  <line x1="960" y1="305" x2="720" y2="305" stroke="#44546a" stroke-width="4"/>
  <line x1="720" y1="305" x2="720" y2="390" stroke="#44546a" stroke-width="4"/>
  <polygon points="720,390 713,376 727,376" fill="#44546a"/>

  <rect x="75" y="500" width="1050" height="70" rx="12" fill="#ffffff" stroke="#b8c4d6"/>
  <text x="100" y="540" font-family="Arial, sans-serif" font-size="18" fill="#23395d">Regla principal: solo el responsable de la etapa actual puede aprobar, rechazar o firmar. La firma solo se habilita al socio firmante.</text>
</svg>
